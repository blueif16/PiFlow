# Skills-index freshness — the bundled marketplace artifact (`site-piflow/public/skills-index.json`) is
# generated by the SITE's own prebuild on every Vercel deploy (site-piflow/scripts/build-skills-index.mjs,
# parity-gated against core's builder). Between pushes it goes stale, so this schedule pokes a Vercel
# Deploy Hook twice a day — a redeploy re-runs prebuild and ships a fresh harvest. Nothing is committed;
# the repo carries no data (the artifact is gitignored).
#
# ONE-TIME SETUP (owner): Vercel → project `piflow` → Settings → Git → Deploy Hooks → create one (branch
# main), then add its URL as the repo secret VERCEL_DEPLOY_HOOK_URL. Until then this workflow no-ops loudly.
name: skills-index-freshness

on:
  schedule:
    - cron: "23 7,19 * * *" # twice a day, off the hour
  workflow_dispatch: {}

permissions: {}

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Poke the Vercel deploy hook (rebuild → fresh /skills-index.json)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL secret is not set — skipping. Create a Deploy Hook in Vercel (project piflow → Settings → Git → Deploy Hooks) and add it as a repo secret to enable twice-daily index refreshes."
            exit 0
          fi
          curl -sf -X POST "$HOOK"
          echo "deploy hook fired — Vercel will rebuild the site and regenerate the bundled skills index."
